name: SwiftDenon
# Per-machine settings (your development team) go in project.local.yml, which isn't committed.
include:
  - path: project.local.yml
    required: false
options:
  bundleIdPrefix: dev.antoine
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  ReceiverKit:
    path: Packages/ReceiverKit
targets:
  SwiftDenon:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes: [AppIcon.icon]
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: ReceiverKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "SwiftDenon connects to your receiver on the local network."
        INFOPLIST_KEY_NSBonjourServices: "_http._tcp"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
  SwiftDenonUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [UITests]
    dependencies:
      - target: SwiftDenon
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SwiftDenon
schemes:
  SwiftDenon:
    build:
      targets:
        SwiftDenon: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [SwiftDenonUITests]
